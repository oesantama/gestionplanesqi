name: Deploy Planes QI con Docker

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar al Servidor por SSH y Desplegar Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22022 }}
          script: |
            cd ~/gestion || cd ~/gestionplanesqi || cd /var/www/gestion || cd ~/repositories/gestion || cd ~/public_html/gestion
            chmod +x ./scripts/deploy_server.sh 2>/dev/null || true
            bash ./scripts/deploy_server.sh

